[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncui"
description = "Library for asynchronous GUI programming"
keywords = ["wxpython", "gui", "asyncio", "tk", "tkinter"]
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.6"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "typing-extensions; python_version < '3.10'"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["asyncui*"]
exclude = ["*tests*"]

[project.urls]
Homepage = "https://github.com/eumis/asyncui"

[tool.pylint.main]
disable = ["too-few-public-methods", "missing-class-docstring", "missing-function-docstring", "missing-module-docstring", "invalid-name", "abstract-class-instantiated"]
max-line-length = 120

[tool.pytest.ini_options]
python_files = '*_tests.py'
python_classes = '*Tests'

[tool.yapf]
ALLOW_SPLIT_BEFORE_DICT_VALUE = true
BLANK_LINE_BEFORE_NESTED_CLASS_OR_DEF = true
BLANK_LINES_AROUND_TOP_LEVEL_DEFINITION = 2
COALESCE_BRACKETS = true
COLUMN_LIMIT = 120
DEDENT_CLOSING_BRACKETS = true
DISABLE_ENDING_COMMA_HEURISTIC = true
EACH_DICT_ENTRY_ON_SEPARATE_LINE = true
INDENT_DICTIONARY_VALUE = true
JOIN_MULTIPLE_LINES = false
SPACES_AROUND_DEFAULT_OR_NAMED_ASSIGN = true
SPACES_BEFORE_COMMENT = 1
SPLIT_ALL_COMMA_SEPARATED_VALUES = false
SPLIT_ALL_TOP_LEVEL_COMMA_SEPARATED_VALUES = true
SPLIT_ARGUMENTS_WHEN_COMMA_TERMINATED = false
SPLIT_BEFORE_DOT = true
SPLIT_BEFORE_EXPRESSION_AFTER_OPENING_PAREN = true

[tool.isort]
line_length = 120

[tool.black]
line-length = 120
